<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>display 프로퍼티</title>
<style>
    #div1 {
        border: 2px solid yellowgreen;
        color: blue;
        background-color: rgb(160, 255, 255);
    }
    span {
        border: 3px dotted red;
        background-color: yellow;
    }
    /* 돌아가기 버튼 */

.back-btn{

    width:220px;
    height:65px;

    border:none;

    border-radius:40px;

    background:black;

    color:rgb(255, 255, 255);

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.1);
}

.back-btn:hover{

    transform:
        translateY(-5px);

    background:#3568ff;

    box-shadow:
        0 18px 35px rgba(53,104,255,0.35);
}
</style>



</head>

<body><div class="top-bar">

        <button class="back-btn"
        onclick="location.href='../index.html'">

            ← 메인으로 돌아가기

        </button>

    </div>

<h3>인라인, 인라인 블록, 블록</h3>

<hr>

나는 <div id="div1" style="display:none">

		div(none)</div>입니다.<br><br>

나는 <div id="div1" style="display:inline">

		div(inline)</div> 입니다.<br><br>

나는 <div id="div1" style="display:inline-block; height:50px">

		div(inline-block)</div> 입니다.<br><br>

나는 <div id="div1">div<span style="display:block">

		span(block)</span> 입니다.

	</div>

</body>

</html>
