<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>애니메이션</title>
<style>
    @keyframes text {
        0%{font-size: 50px;}
        
        100%{font-size: 150px;}
    }
    h3 {
        animation-name: text;
        animation-duration: 3s;
        animation-iteration-count: infinite;
    }
    .top-bar{

    width:100%;

    padding:30px 50px;

    position:sticky;

    top:0;

    z-index:999;

    background:#eef3f9;
}

/* 돌아가기 버튼 */

.back-btn{

    width:220px;
    height:65px;

    border:none;

    border-radius:40px;

    background:black;

    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.1);
}

.back-btn:hover{

    transform:
        translateY(-5px);

    background:#3568ff;

    box-shadow:
        0 18px 35px rgba(53,104,255,0.35);
}
</style>



</head>

<body><div class="top-bar">

        <button class="back-btn"
        onclick="location.href='../index.html'">

            ← 메인으로 돌아가기

        </button>

    </div>

<h3>꽝!</h3>

<hr>

<p>꽝! 글자가 3초동안 500%에서

시작하여 100%로 바뀌는

애니메이션입니다. 무한 반복합니다.</p>

</body>

</html>
