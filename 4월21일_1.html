<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>이벤트 리스너 속성에 자바스크립트 코드</title>
<style>
    .top-bar{

    width:100%;

    padding:30px 50px;

    position:sticky;

    top:0;

    z-index:999;

    background:#eef3f9;
}

/* 돌아가기 버튼 */

.back-btn{

    width:220px;
    height:65px;

    border:none;

    border-radius:40px;

    background:black;

    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.1);
}

.back-btn:hover{

    transform:
        translateY(-5px);

    background:#3568ff;

    box-shadow:
        0 18px 35px rgba(53,104,255,0.35);
}
</style>
<script src="20260421.js">

</script>
</head>
<body><div class="top-bar">

        <button class="back-btn"
        onclick="location.href='../index.html'">

            ← 메인으로 돌아가기

        </button>

    </div>
<h3>마우스 올려 보세요</h3>
<hr>
<img src="이미지/apple.png" alt="이미지" onmouseover="over(this)" onmouseout="out(this)">

<script>
    function over(obj) {
        obj.src='이미지/banana.png';
    }
    function out(obj) {
        obj.src='이미지/apple.png';
    }
    document.write("<h3>Welcome!</h3>");
    document.write('abc'+23+'<br>');
    document.write(23+'abc'+'<br>');
    document.write(23 + 45 + 'abc<br>');
    document.write('abc' + 23 + 45 + '<br>');
    document.write('a'>'b');
    document.write('<br>');
    let x=5, y=3;
    let big = (x>y) ? x-y : y-x;
    document.write(big);

    </script>
</body>
</html>
