<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>상세 페이지</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Pretendard', sans-serif;
}

body{
    background:#eef3f9;
}

/* 전체 */

.container{
    width:1200px;
    margin:auto;
    padding:50px 0;
}

/* 상단 */

.top-bar{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:40px;
}

/* 돌아가기 버튼 */

.back-btn{

    padding:16px 35px;

    border:none;

    border-radius:15px;

    background:white;

    color:#3568ff;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
        0 8px 20px rgba(0,0,0,0.08);
}

.back-btn:hover{

    background:#4a90ff;

    color:white;

    transform:translateY(-5px);

    box-shadow:
        0 18px 35px rgba(74,144,255,0.35);
}

/* 메인 카드 */

.detail-card{

    background:white;

    border-radius:35px;

    padding:60px;

    box-shadow:
        0 15px 45px rgba(0,0,0,0.08);
}

/* 제목 */

.title-area{

    text-align:center;

    margin-bottom:50px;
}

.title-area h1{

    font-size:55px;

    color:#22335a;

    margin-bottom:20px;
}

.title-area p{

    color:#7b8ca8;

    font-size:20px;
}

/* 이미지 영역 */

.preview{

    width:100%;
    height:500px;

    background:#dce7f8;

    border-radius:25px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#7b8ca8;

    font-size:30px;

    margin-bottom:45px;

    border:3px dashed #9ebfff;
}

/* 설명 */

.description{

    background:#f8fbff;

    padding:40px;

    border-radius:25px;

    line-height:2;
}

.description h2{

    margin-bottom:20px;

    color:#2f4a80;

    font-size:32px;
}

.description p{

    color:#555;

    font-size:18px;
}

</style>
</head>

<body>

<div class="container">

    <!-- 상단 -->

    <div class="top-bar">

        <button class="back-btn"
        onclick="location.href='index.html'">

            ← 메인으로 돌아가기

        </button>

        <div style="color:#7b8ca8;font-weight:bold;">
            PORTFOLIO SUB PAGE
        </div>

    </div>

    <!-- 카드 -->

    <div class="detail-card">

        <div class="title-area">

            <h1>프로젝트 제목</h1>

            <p>
                제작일 : 2026.05.26
                |
                사용 기술 : HTML, CSS
            </p>

        </div>

        <!-- 이미지 -->

        <div class="preview">
            프로젝트 이미지 자리
        </div>

        <!-- 설명 -->

        <div class="description">

            <h2>프로젝트 설명</h2>

            <p>
                여기에 프로젝트 설명 내용을 작성하세요.
                어떤 기능을 만들었는지,
                무엇을 배웠는지,
                어떤 기술을 사용했는지 작성하면 됩니다.
            </p>

        </div>

    </div>

</div>

</body>
</html>
