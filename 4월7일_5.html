<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        #red {
            position: fixed;
            background-color: red;
            display: inline-block;
            left: 100px;
            top: 10px;
        }
        #yellow {
            position: fixed;
            background-color: yellow;
            display: inline-block;
            left: 200px;
            top: 100px;
        }
        #green {
            position: fixed;
            background-color: green;
            display: inline-block;
            left: 250px;
            top: 100px;
        }
        #blue {
            position: fixed;
            background-color: blue;
            display: inline-block;
            left: 250px;
            top: 200px;
        }
        .top-bar{

    width:100%;

    padding:30px 50px;

    position:sticky;

    top:0;

    z-index:999;

    background:#eef3f9;
}

/* 돌아가기 버튼 */

.back-btn{

    width:220px;
    height:65px;

    border:none;

    border-radius:40px;

    background:black;

    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.1);
}

.back-btn:hover{

    transform:
        translateY(-5px);

    background:#3568ff;

    box-shadow:
        0 18px 35px rgba(53,104,255,0.35);
}
    </style>
</head>
<body><div class="top-bar">

        <button class="back-btn"
        onclick="location.href='../index.html'">

            ← 메인으로 돌아가기

        </button>

    </div>
    <div id="red" style="width: 50px; height:50px"></div>
    <div id="yellow" style="width: 200px; height:200px"></div>
    <div id="green" style="width: 50px; height:50px"></div>
    <div id="blue" style="width: 50px; height:50px"></div>
</body>
</html>
