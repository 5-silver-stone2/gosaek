<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>절대 배치</title>
<style>
    div {
        display: inline-block;
        position: absolute;
        border: 1px solid lightgray;
    }
    div > p {
        display: inline-block;
        position: absolute;
        height: 20px;
        width: 15px;
        background-color: lightgrey;
    }
    /* #fixed {
        position: fixed;
        bottom: 10px;
        right: 10px;
        width: 120px;
        padding: 5px;
        background-color: red;
        color: white;
    } */
    #fixed {
        float: right;
        border: 1px dotted black;
        width: 8em;
        padding: 0,25em;
        margin: 1em;
    }
    .top-bar{

    width:100%;

    padding:30px 50px;

    position:sticky;

    top:0;

    z-index:999;

    background:#eef3f9;
}

/* 돌아가기 버튼 */

.back-btn{

    width:220px;
    height:65px;

    border:none;

    border-radius:40px;

    background:black;

    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.1);
}

.back-btn:hover{

    transform:
        translateY(-5px);

    background:#3568ff;

    box-shadow:
        0 18px 35px rgba(53,104,255,0.35);
}
</style>



</head>

<body><div class="top-bar">

        <button class="back-btn"
        onclick="location.href='../index.html'">

            ← 메인으로 돌아가기

        </button>

    </div>

<h3>Merry Christmas!</h3>

<hr>

<p id="fixed">예수님이 탄생하셨습니다.</p>

<div>

	<img src="이미지/christmastree.png"

			width="200" height="200" alt="크리스마스 트리">

	<p style="left:50px; top:30px">M</p>

	<p style="left:100px; top:0px">E</p>

	<p style="left:100px; top:80px">R</p>

	<p style="left:150px; top:110px">R</p>

	<p style="left:30px; top:130px">Y</p>

</div>

</body>

</html>
