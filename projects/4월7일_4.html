<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>z-index 프로퍼티</title>
<style>
    div {
        position: absolute;
    }
    img {
        position: absolute;
    }
    #spadeA {
        z-index: -3; left: 10px; top: 20px;
    }
    #spade2 {
        z-index: 2; left: 40px; top: 30px;
    }
    #spade3 {
        z-index: 3; left: 70px; top: 40px;
    }
    #spade7 {
        z-index: 7; left: 100px; top: 50px;
    }
    .top-bar{

    width:100%;

    padding:30px 50px;

    position:sticky;

    top:0;

    z-index:999;

    background:#eef3f9;
}

/* 돌아가기 버튼 */

.back-btn{

    width:220px;
    height:65px;

    border:none;

    border-radius:40px;

    background:black;

    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.1);
}

.back-btn:hover{

    transform:
        translateY(-5px);

    background:#3568ff;

    box-shadow:
        0 18px 35px rgba(53,104,255,0.35);
}
</style>



</head>

<body><div class="top-bar">

        <button class="back-btn"
        onclick="location.href='../index.html'">

            ← 메인으로 돌아가기

        </button>

    </div>

<h3>z-index 프로퍼티</h3>

<hr>

<div>

	<img id="spadeA" src="이미지/spade_A.png"

		width="100" height="140" alt="스페이드A">

	<img id="spade2" src="이미지/spade_2.png"

		width="100" height="140" alt="스페이드2">

	<img id="spade3" src="이미지/spade_3.png"

		width="100" height="140" alt="스페이드3">

	<img id="spade7" src="이미지/spade_7.png"

		width="100" height="140" alt="스페이드7">

</div>

</body>

</html>
