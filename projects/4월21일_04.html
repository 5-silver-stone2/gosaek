<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>for 문</title>
<style>
    .top-bar{

    width:100%;

    padding:30px 50px;

    position:sticky;

    top:0;

    z-index:999;

    background:#eef3f9;
}

/* 돌아가기 버튼 */

.back-btn{

    width:220px;
    height:65px;

    border:none;

    border-radius:40px;

    background:black;

    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.1);
}

.back-btn:hover{

    transform:
        translateY(-5px);

    background:#3568ff;

    box-shadow:
        0 18px 35px rgba(53,104,255,0.35);
}
</style>
</head>
<body><div class="top-bar">

        <button class="back-btn"
        onclick="location.href='../index.html'">

            ← 메인으로 돌아가기

        </button>

    </div>
<h3>for 문으로 10px~35px 크기 출력</h3>
<hr>
<script>
	// 이곳에 자바스크립트 코드를 작성하라.
    for (let size=10; size<=35 ; size+=5) {
        document.write("<span ");
        document.write("style='font-size:" + size + "px;'>");
        document.write("px"); //abc
        document.write("</span>");


    }
</script>
<!-- <span style='font-size: 5px;'>abc</span> -->
</body>
</html>
for, while, do~while
